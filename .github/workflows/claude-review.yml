name: Claude review

# Advisory, not a required check. The action refuses to run when this file
# differs from the default branch, so a PR cannot rewrite its own reviewer.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Forks and Dependabot get no secrets.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Without the secret the action exits green having reviewed nothing.
      - name: Require the token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set. Generate one with 'claude setup-token', then: gh secret set CLAUDE_CODE_OAUTH_TOKEN"
            exit 1
          fi

      - name: Record start time
        id: started
        run: echo "at=$(date -u -d '-2 minutes' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@16f9f71ab9c490faf367f94dd294897edc25be33 # v1
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }}

            howbad finds every credential a coding agent running as the user could pick up
            (environment, gh, npm, AWS, kubeconfig, gcloud, MCP configs of Claude Code,
            Codex, Cursor and others) and asks each provider, read-only, what it can do.
            It runs on developer laptops and handles their live credentials, so a bug here
            can do the exact damage the tool warns about.

            Build, test, lint and govulncheck already run on this PR. Do not repeat them.
            Look for what only a reader can catch, in this order:

            1. Secret exposure. A token, password, database URL or AWS secret key must
               never reach stdout, stderr, JSON output, error messages, panics or logs.
               Credential.secret is unexported for this reason; anything that formats a
               Credential, wraps an HTTP error that might carry an Authorization header,
               or prints a raw config value is the most serious defect possible here.

            2. Where secrets are sent. Each credential may only go to the provider that
               issued it (GitHub token to the GitHub API host, npm token to the npm
               registry, and so on). Sending one to a different host, a different
               registry from .npmrc, or a public endpoint like npm search is a leak.

            3. Read-only. Every provider call must be non-mutating. Anything that writes,
               deletes, rotates or registers is a defect. Kubernetes
               SelfSubjectAccessReview/SelfSubjectReview are the only allowed creates.

            4. Under-reporting. A reach that is silently dropped or downgraded tells a
               user they are safe when they are not, which is the dangerous direction.
               Check permission logic (GitHub scopes vs fine-grained tokens, IAM
               classification, Kubernetes checks) and anything that turns an error into
               "nothing found".

            5. Running helpers. gh auth token, AWS credential_process and kubeconfig
               exec plugins run code; --no-exec must stop all of them, and none may
               prompt on the terminal.

            6. Output contract. --json fields and --fail-on exit codes are an API.
               A renamed field or a changed exit code is a breaking change.

            Post findings as inline comments on the lines they concern and one top-level
            comment for the summary. Cite `file:line`. If the diff is clean against all of
            the above, say so in one line rather than manufacturing nits.

            Create the summary file with the Write tool, then post it with exactly one command:
            `gh pr comment <number> --body-file <path>`. printf, echo, heredocs, command
            substitution and chained commands (`;`, `&&`) do not match the allowlist and are
            refused. Leave the file in place; the runner is discarded. Do not sign anything you post: no "Generated with" footer and no
            co-authored-by line.

          # --allowedTools is a closed list: the read tools must be named too.
          claude_args: |
            --allowedTools "Read,Grep,Glob,Write,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      - name: Report refused tool calls
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          echo "action conclusion: '${{ steps.claude.outputs.conclusion }}'"
          if [ -n "${EXECUTION_FILE:-}" ] && [ -f "$EXECUTION_FILE" ]; then
            jq -r '[.. | objects | select(.type? == "result") | .permission_denials?]
              | map(select(. != null)) | last // [] | .[]
              | "denied: \(.tool_name // "?") \(.tool_input | tojson | .[0:200])"' \
              "$EXECUTION_FILE" 2>/dev/null || true
          fi

      # Silence is fine; silence with a refused tool call means the PR went
      # unreviewed behind a green check.
      - name: Fail on a review that was not delivered
        if: always() && steps.claude.outputs.conclusion == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SINCE: ${{ steps.started.outputs.at }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          BOT: claude[bot]
        run: |
          set -euo pipefail
          fresh() {
            gh api --paginate "$1" --jq \
              "[.[] | select(.user.login == \"$BOT\") | select((.$2 // \"\") >= \"$SINCE\")] | length" |
              awk '{ n += $1 } END { print n + 0 }'
          }
          total=$(( $(fresh "repos/$REPO/issues/$PR/comments" updated_at) + $(fresh "repos/$REPO/pulls/$PR/comments" updated_at) + $(fresh "repos/$REPO/pulls/$PR/reviews" submitted_at) ))
          echo "posted since $SINCE: $total"
          [ "$total" -gt 0 ] && exit 0
          denials=unknown
          if [ -n "${EXECUTION_FILE:-}" ] && [ -f "$EXECUTION_FILE" ]; then
            denials=$(jq -r '[.. | objects | select(.type? == "result") | .permission_denials_count?]
              | map(select(. != null)) | last // 0' "$EXECUTION_FILE" 2>/dev/null || echo unknown)
          fi
          if [ "$denials" = "0" ]; then
            echo "::notice::The review posted nothing and nothing was refused."
            exit 0
          fi
          echo "::error::The review was refused a tool call ($denials) and posted nothing. Widen --allowedTools."
          exit 1
